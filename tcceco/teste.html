    <style>
        /* Reset básico de margens */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #34344f;
            color: #333;
            /* Compensação para a barra fixa no topo não cobrir o conteúdo */
            padding-top: 60px;
        }

        /* Barra de Notificação Topo */
        .barra {
            background-color: rgb(123, 115, 221);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px 15px;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .barra h2 {
            color: #fff;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: center;
        }

        .barra a {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 3px 10px;
            border-radius: 4px;
            text-decoration: underline;
            margin-left: 8px;
            transition: background-color 0.2s;
        }

        .barra a:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }

        .barra2 {
    background-color: rgb(123, 115, 221);
    padding: 6px 10px;
    text-align: center;
    width: 1161px;
    box-sizing: border-box;
}

.barra2 h2 {
    color: #fff;
    font-size: 0.8rem;
    font-weight: 500;
    margin: 0;
}

.barra2 a {
    color: #fff;
    background-color: rgba(255, 255, 255, 0.2);
    padding: 2px 7px;
    border-radius: 3px;
    text-decoration: underline;
    margin-left: 5px;
}

.barra2 a:hover {
    background-color: rgba(255, 255, 255, 0.4);
}

        /* Título Principal */
        .titulo {
            text-align: center;
            margin: 40px 20px 20px 20px;
        }

        .titulo h1 {
            font-weight: 500;
            font-size: 2.5rem;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .titulo h2 {
            font-size: 1.1rem;
            color: #000000;
            font-weight: 500;
            margin-top: 5px;
        }

        /* Container dos Imóveis (Grid) */
        .divs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Cartão de Cada Imóvel */
        .divs>div {
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .divs>div:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
        }

        .divs label h2 {
            font-size: 1.1rem;
            padding: 15px;
            text-align: center;
            color: #222;
            text-transform: capitalize;
        }

        /* Estilização Geral das Imagens */
        .divs img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            /* Ajusta a imagem sem distorcer */
            display: block;
        }
    </style>
</head>
