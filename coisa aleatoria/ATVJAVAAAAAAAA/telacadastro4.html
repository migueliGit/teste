<style>
        /* Reset básico de margens */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #34344f;
            color: #333;
            /* Compensação para a barra fixa no topo não cobrir o conteúdo */
            padding-top: 60px;
        }
        /* Título Principal */
        .titulo {
            text-align: center;
            margin: 40px 20px 20px 20px;
        }

        .titulo h1 {
            font-weight: 500;
            font-size: 2.5rem;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .titulo h2 {
            font-size: 1.1rem;
            color: #000000;
            font-weight: 500;
            margin-top: 5px;
        }

        /* Container dos Imóveis (Grid) */
        .divs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Cartão de Cada Imóvel */
        .divs > div {
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .divs > div:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
        }

        .divs label h2 {
            font-size: 1.1rem;
            padding: 15px;
            text-align: center;
            color: #222;
            text-transform: capitalize;
        }

        /* Estilização Geral das Imagens */
        .divs img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        /* ----- ESTILO DO FORMULÁRIO DE CADASTRO ----- */
        .cadastro {
            background-color: #ffffff;
            max-width: 400px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .cadastro h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .cadastro form {
            display: flex;
            flex-direction: column;
        }

        .cadastro label {
            margin-bottom: 5px;
            font-weight: 600;
            color: #444;
            font-size: 0.9rem;
        }

        .cadastro input {
            padding: 10px 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .cadastro input:focus {
            border-color: rgb(123, 115, 221);
        }

        .cadastro button {
            background-color: rgb(123, 115, 221);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .cadastro button:hover {
            background-color: rgb(100, 92, 198);
        }

        .cadastro p {
            text-align: center;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #666;
        }

        .cadastro p a {
            color: rgb(123, 115, 221);
            text-decoration: none;
            font-weight: bold;
        }

        .cadastro p a:hover {
            text-decoration: underline;
        }
    </style>
